# yaml-language-server: $schema=../../schema/experiment.schema.json

# ========================================================
# Catalog metadata
# ========================================================
metadata:
  kind: preset
  name: denoising_care
  task: denoising_care
  description: Current supervised U-Net denoising recipe. Instantiate into local/
    before training.

# ========================================================
# General experiment settings
# ========================================================
experiment:
  mode: train
  exp_name: replace_me_experiment
  overwrite: false
  post_training_inference: true
  task:
    name: denoising_care
    loss: CharEdge

# ========================================================
# Paths
# ========================================================
routing:
  data_subfolder: preprocess/recon
  models_subfolder: Denoising
  tensorboard_subfolder: Denoising

# ========================================================
# Dataset / DataLoader configuration
# ========================================================
data:
  dataset_name: replace_me_dataset
  data_format: single
  canonical_load: true
  prep_before: true
  already_split: true
  filters:
    - tiff
    - tif
  paired: true
  input: replace_me_input
  target: replace_me_target
  patch_size: 128
  val_patch_size: 512
  batch_size: 64
  initial_crop: null
  augmentation: false
  patch_thresh: null
  select_on_gt: true

# ========================================================
# Normalization / Noise
# ========================================================
normalization:
  norm_prm:
    clip: -3

# ========================================================
# Model configuration
# ========================================================
model:
  architecture: unet
  parameters:
    feat: 64
    depth: 4
    in_channels: 1
    out_channels: 1
    activation: swish
    norm: group
    gr_norm: 8
    dropout: 0.1
    remove_skip_con: 1

# ========================================================
# Training configuration
# ========================================================
training:
  n_epochs: 100
  batch_size: 8
  learning_rate: 0.001
  optimizer: Adam
  scheduler:
    name: ReduceLROnPlateau
  progress_bar: true
  debug_stop: false
  warmup:
    enabled: false
    steps: 500
    start_factor: 0.1
  auto_stop:
    enabled: false
    metrics: val_loss
    patience: 50

# ========================================================
# Saving configuration
# ========================================================
saving:
  enabled: true
  canonical_save: true
  overwrite_best: true
  save_last: true
  entire_model: true
  state_dict: true
  validation_images: true
  validation_freq: 10

# ========================================================
# Tensorboard configuration
# ========================================================
tensorboard:
  enabled: false
  validation_images: true
