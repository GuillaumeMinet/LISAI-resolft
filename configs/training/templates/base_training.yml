# yaml-language-server: $schema=../../schema/experiment-template.schema.json

# ========================================================
# Catalog metadata
# ========================================================
metadata:
  kind: template
  name: base_training
  task: custom
  description: Generic training config starting point with placeholders.

# ========================================================
# General experiment settings
# ========================================================
experiment:
  mode: train
  exp_name: <experiment_name>
  overwrite: false
  post_training_inference: true
  task:
    name: custom

# ========================================================
# Paths
# ========================================================
routing:
  data_subfolder: <data_subfolder>
  models_subfolder: <models_subfolder>
  tensorboard_subfolder: <models_subfolder>

# ========================================================
# Dataset / DataLoader configuration
# ========================================================
data:
  dataset_name: <dataset_name>
  data_format: <data_format>
  canonical_load: true
  prep_before: true
  already_split: true
  filters:
    - tif
    - tiff
  paired: false
  input: <input>
  target: null
  patch_size: 64
  val_patch_size: 256
  batch_size: 32

# ========================================================
# Model configuration
# ========================================================
model:
  architecture: <architecture>
  parameters: {}

# ========================================================
# Training configuration
# ========================================================
training:
  n_epochs: 100
  batch_size: 8
  learning_rate: 1e-4
  optimizer: Adam
  scheduler: ReduceLROnPlateau
  progress_bar: true
  debug_stop: false

# ========================================================
# Saving configuration
# ========================================================
saving:
  enabled: true
  canonical_save: true
  validation_images: true
  validation_freq: 10

# ========================================================
# Tensorboard configuration
# ========================================================
tensorboard:
  enabled: false
